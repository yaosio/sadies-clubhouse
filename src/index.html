<!doctype html>
<!--
  Sadie's Clubhouse, a lost 90s shareware activity center: Sadie's mansion, a room per activity. Built from separate
  source modules into the game files beside this page (game/*.js, each room's fetched as you come up
  to its door); the full project (source, tests, docs, build tools) is embedded near the end of
  this file as JSON, in the script element whose id is jelly-source, shaped {files: {"path": "text"}}.
  Unpack it, then see README.md and CLAUDE.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sadie's Clubhouse</title>
<!-- phones must not "boost" small text to make it easier to read: every box of words here is
     sized for its text, and boosted text spills out and gets cut off -->
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- the mansion's lettering, asked for straight away (the same address as src/clubhouse/mansion.html's,
     so it's already here when the mansion puts it in) -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Patrick+Hand&display=swap">
<!-- the game files needed to open the mansion, all asked for at once (tools/build.mjs fills this in) -->
<!--@preload-->
</head>
<body>
<!-- the clubhouse (src/main.js, in game/) puts the activity here. It starts as soon as its files
     are here (`async`), not once the whole page has come: the copy of the project at the end is big -->
<script type="module" async>
/*@script*/
</script>
<!--@source-->
</body>
</html>
