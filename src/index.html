<!doctype html>
<!--
  Sadie's Clubhouse, a lost 90s shareware activity center: Sadie's clubhouse, a room per activity. Built from separate
  source modules into the game files beside this page (game/*.js, each room's fetched as you come up
  to its door); the full project (source, tests, docs, build tools) is a file beside it too, named in
  the link element whose id is jelly-source (game/source-*.json), shaped {files: {"path": "text"}}.
  Unpack it (tools/unpack.mjs, or by hand), then see README.md and CLAUDE.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sadie's Clubhouse</title>
<!-- phones must not "boost" small text to make it easier to read: every box of words here is
     sized for its text, and boosted text spills out and gets cut off -->
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
<!-- the game's fonts are files of its own, not Google's (tools/fonts/get.mjs): the rules for them, and the
     clubhouse's lettering asked for straight away (tools/build.mjs fills this in) -->
<!--@fonts-->
<!-- the game files needed to open the clubhouse, all asked for at once (tools/build.mjs fills this in) -->
<!--@preload-->
</head>
<body>
<!-- the clubhouse (src/main.js, in game/) puts the activity here. It starts as soon as its files
     are here (`async`), not once the whole page has come -->
<script type="module" async>
/*@script*/
</script>
<!--@source-->
</body>
</html>
