<!-- The mansion's screen: src/clubhouse/mansion.js puts it in the page, and takes it out again when
     an activity starts. On screen there's only the pause button, a hint at a door or a computer (or
     how to play a game that's in its room), on a phone the thumb stick, and whatever a way of playing
     puts in before #flash (src/clubhouse/play/: painting's switch and box): the mansion is the whole screen. -->
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<div id="mansion">
  <canvas id="view" aria-label="Sadie's mansion, in 3D"></canvas>
  <button id="pause" class="hud" aria-label="Pause"></button>
  <div id="keysHint" class="hud"><kbd>W A S D</kbd> WALK &nbsp; <kbd>MOUSE</kbd> LOOK (CLICK FIRST)</div>
  <div id="useHint" class="hud" hidden><kbd>E</kbd> <canvas width="16" height="16" hidden></canvas><span></span></div>
  <div id="arcadeHint" class="hud" hidden></div>
  <div id="stick" class="hud" hidden><i></i></div>
  <button id="use" class="hud" hidden>GO</button>
  <div id="flash" hidden></div>
  <div id="letter" hidden>
    <div class="card"><canvas id="letterArt" width="360" height="228"></canvas><button id="ok">OK</button></div>
  </div>
  <div id="menu" hidden>
    <div class="panel">
      <h2>PAUSED</h2>
      <button id="resume">RESUME</button>
      <div class="row" id="volumes"><button id="vol-music">MUSIC: ON</button><button id="vol-sounds">SOUNDS: ON</button><button id="vol-voices">VOICES: ON</button></div>
      <p class="how" id="how"></p>
      <div id="saves">
        <h3>YOUR SAVES</h3>
        <div class="row" id="backups"><button id="saveBackup">SAVE A BACKUP</button><button id="loadBackup">LOAD A BACKUP</button></div>
        <input type="file" id="backupFile" accept=".json,application/json" hidden>
        <p id="saveNote"></p>
      </div>
      <div id="dev">
        <h3>START OVER</h3>
        <div id="resets"></div>
        <div id="sure" hidden>
          <p id="sureAsk"></p>
          <div class="row"><button id="sureYes">YES, ERASE IT</button><button id="sureNo">NO, KEEP IT</button></div>
        </div>
      </div>
    </div>
  </div>
  <!--@badge-->
</div>
