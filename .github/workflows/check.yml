# The game's checks on GitHub, started by hand only (see below): `npm run check` (docs/clubhouse/checks/README.md),
# split up so each activity (and the mansion) gets a computer of its own, all at the same time.
#
#   plan      the code checker (lint) and the docs are small, listed and shaped alike (tools/docs.mjs),
#             on every pull request, whatever it changes; and which activities still need checking:
#             an activity that already passed on exactly its code (remembered between runs) is
#             skipped, as on Claude's own machine. On main, after a merge, what the pull request's
#             last green run passed counts too (main can't see what a pull request remembered), so
#             code that was checked there isn't checked all over again before it can be published
#   check     one computer per activity that needs it: `npm run check -- --only <activity>` (past
#             16 of them, small ones share: `--only a+b`, shared out by how long each took last time)
#   remember  saves what passed for next time, and is the one tick (or cross) for the whole lot
#
# It only runs when started by hand (the Actions page's "Run workflow"): the repository is private, so
# GitHub's computers cost minutes, and running on every push used up the free month in two days
# (2026-10-03). Claude's own `npm run check` before every push, merge and publish is the check now.
name: check

on:
  workflow_dispatch:

# (reading the pull request a merge came from, and its runs' notes of what passed)
permissions:
  contents: read
  actions: read
  pull-requests: read

# (GitHub's own steps, checkout and the rest, run on Node 24 rather than the Node 20 GitHub is retiring)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# a newer push to the same pull request stops the older run
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      todo: ${{ steps.plan.outputs.todo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: node tools/docs.mjs
      - uses: actions/cache/restore@v4
        with:
          path: dist/*-passed-*
          key: passed-${{ github.sha }}
          restore-keys: passed-
      # on main: what the merged pull request's last green run had passed (its notes are named after
      # exactly the files they passed on, so they only count for code that's the same here)
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].head.sha' 2>/dev/null) || true
          run=$([ -n "$head" ] && gh run list -R "${{ github.repository }}" --workflow check.yml --commit "$head" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null) || true
          if [ -n "$run" ] && gh run download "$run" -R "${{ github.repository }}" -n passed-all -D from-pr 2>/dev/null; then
            mkdir -p dist && cp from-pr/*-passed-* dist/ && echo "counting what pull request run $run passed: $(ls from-pr | wc -l) notes"
          else echo "no pull request run to count (pull request head ${head:-none})"; fi
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: passed-from-pr
          path: dist/*-passed-*
          if-no-files-found: ignore
          retention-days: 1
      - id: plan
        run: echo "todo=$(node tools/check.mjs --plan ${{ github.event_name == 'schedule' && '--retest' || '' }})" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    if: needs.plan.outputs.todo != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        activity: ${{ fromJSON(needs.plan.outputs.todo) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the hidden browser the checks play the game in (the version package-lock.json names)
      - id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      # (the computer already has what the browser needs from Ubuntu; installing it again each time
      # cost 15 to 25 s per computer)
      - uses: actions/cache/restore@v4
        with:
          path: dist/*-passed-*
          key: passed-${{ github.sha }}
          restore-keys: passed-
      # anything an activity's checks make first (its browser.mjs's prepare(): Dropper World's full
      # board), kept until that activity's own files change
      - uses: actions/cache@v4
        with:
          path: dist/prepared/${{ matrix.activity }}
          key: prepared-${{ matrix.activity }}-${{ hashFiles(format('src/activities/{0}/**', matrix.activity), format('tools/{0}/**', matrix.activity)) }}
      - run: npm run check -- --only ${{ matrix.activity }} --no-lint ${{ github.event_name == 'schedule' && '--retest' || '' }}
      # (just its own activities' notes of what passed)
      - if: always()
        run: |
          mkdir -p passed
          for a in $(echo "${{ matrix.activity }}" | tr '+' ' '); do cp dist/*-passed-$a-* passed/ 2>/dev/null || true; done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passed-${{ matrix.activity }}
          path: passed/
          if-no-files-found: ignore
          retention-days: 1
      # the screenshots, to look at when something failed
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.activity }}
          path: dist/check/
          retention-days: 7

  remember:
    needs: [plan, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: dist/*-passed-*
          key: passed-${{ github.sha }}
          restore-keys: passed-
      - uses: actions/download-artifact@v4
        with:
          pattern: passed-*
          path: dist
          merge-multiple: true
      - uses: actions/cache/save@v4
        with:
          path: dist/*-passed-*
          key: passed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # everything that has passed, for main to count once this pull request is merged
      - uses: actions/upload-artifact@v4
        with:
          name: passed-all
          path: dist/*-passed-*
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - name: every activity passed
        run: |
          echo "plan: ${{ needs.plan.result }}, checks: ${{ needs.check.result }}"
          [ "${{ needs.plan.result }}" = success ] && { [ "${{ needs.check.result }}" = success ] || [ "${{ needs.check.result }}" = skipped ]; }
