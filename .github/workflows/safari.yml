# Once a week, the game in WebKit (the engine under Safari and every iPhone): does it open, draw and
# run without errors? The real checks (check.yml) play it in Chromium only. See tools/webkit-smoke.mjs.
# A red run shows on the repository's Actions page, worth a look when starting new work.
name: safari

on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1'

permissions:
  contents: read

# (GitHub's own steps, checkout and the rest, run on Node 24 rather than the Node 20 GitHub is retiring)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - run: node tools/webkit-smoke.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-webkit
          path: dist/check/webkit/
          retention-days: 7
