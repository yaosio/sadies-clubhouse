<title>Sadie's Play Place 3D</title>
<!--
  A test of the Play Place clubhouse in real (crappy, late-90s) 3D. Not the game.
  Built by art/play-place/room3d/make.py, which embeds the pictures drawn with the 90s kit.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --face:#3b2a8c; --hi:#8a78ff; --hi2:#c8bcff; --lo:#1c1050; --lo2:#0a0628; --gold:#ffd23a;
  --ink:#12082e; --led:#4aff6a; --led-hi:#ffd23a; --cyan:#2ee6d6; --pink:#ff8ce0; --ground:#0a0628;
  --px: "Silkscreen", "Courier New", monospace;
}
html,body{height:100%}
body{background:var(--ground);color:#fff;font-family:var(--px);padding-inline:16px;padding-block:12px;box-sizing:border-box;overflow:hidden}
*{box-sizing:border-box}
#frame{position:relative;height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:10px;
  background:var(--face) var(--weave) repeat;image-rendering:pixelated;
  border:3px solid;border-color:var(--hi2) var(--lo2) var(--lo2) var(--hi2);box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.rivet{position:absolute;width:6px;height:6px;background:linear-gradient(135deg,#fff6b0 0 35%,var(--gold) 35% 70%,#9a6a08 70%)}
.rivet.tl{left:4px;top:4px}.rivet.tr{right:4px;top:4px}.rivet.bl{left:4px;bottom:4px}.rivet.br{right:4px;bottom:4px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#logo{image-rendering:pixelated;display:block;max-width:100%}
.tag{background:#140a3a;border:2px solid;border-color:var(--lo2) var(--hi2) var(--hi2) var(--lo2);padding:4px 8px;font-size:11px;line-height:1.35;letter-spacing:.04em}
.tag b{color:var(--cyan);font-weight:400;display:block}.tag i{color:var(--pink);font-style:normal;display:block}
.sunk{border:3px solid;border-color:var(--lo2) var(--hi2) var(--hi2) var(--lo2);box-shadow:inset 1px 1px 0 var(--lo)}
#view{position:relative;flex:1;min-height:0;background:#000;cursor:var(--hand),pointer;touch-action:none}
#c{display:block;width:100%;height:100%;image-rendering:pixelated}
#stats{position:absolute;right:6px;top:4px;font-size:10px;color:var(--gold);text-shadow:1px 1px 0 var(--ink);pointer-events:none;letter-spacing:.05em}
#hint{position:absolute;left:120px;right:8px;bottom:10px;text-align:center;font-size:11px;color:#fff;text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink);pointer-events:none;transition:opacity .6s}
#pad{position:absolute;left:8px;bottom:8px;display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,30px);gap:2px;opacity:.92}
#pad button{display:grid;place-items:center;padding:0;cursor:pointer;touch-action:none;background:linear-gradient(#6a58d8,#4432a8);
  border:2px solid;border-color:var(--hi2) var(--lo2) var(--lo2) var(--hi2);border-radius:3px}
#pad button.down{background:linear-gradient(#fff6b0,var(--gold) 50%,#ff9a1e);border-color:var(--lo2) #fffbe0 #fffbe0 var(--lo2)}
#pad [data-d=f]{grid-area:1/2}#pad [data-d=l]{grid-area:2/1}#pad [data-d=r]{grid-area:2/3}#pad [data-d=b]{grid-area:3/2}
#pad i{width:0;height:0;border:7px solid transparent;filter:drop-shadow(1px 1px 0 var(--ink))}
#pad i.up{border-bottom-color:#fff;border-top-width:0}#pad i.dn{border-top-color:#fff;border-bottom-width:0}
#pad i.lt{border-right-color:#fff;border-left-width:0}#pad i.rt{border-left-color:#fff;border-right-width:0}
#dash{display:flex;gap:8px;align-items:stretch}
#led{flex:1;min-width:0;min-height:72px;padding:6px 8px;background:#06140a;
  background-image:radial-gradient(#0e2a14 1px,transparent 1.2px);background-size:3px 3px;
  font-size:12px;line-height:1.3;color:var(--led);letter-spacing:.04em;text-transform:uppercase}
#led .t{color:var(--led-hi)}
#play{flex:0 0 auto;min-width:96px;font:700 22px/1 var(--px);color:#fff;letter-spacing:.04em;text-shadow:2px 2px 0 #8a2a00;cursor:pointer;
  background:linear-gradient(#fff6b0,var(--gold) 45%,#ff9a1e);border:3px solid;border-color:#fffbe0 #8a4a00 #8a4a00 #fffbe0;border-radius:4px}
#play:active,#play.down{border-color:#8a4a00 #fffbe0 #fffbe0 #8a4a00;transform:translateY(1px)}
#play:disabled{filter:saturate(.3) brightness(.7);cursor:default}
#keys{display:flex;flex-wrap:wrap;gap:4px 14px;padding-top:2px}
.key{display:flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;color:#fff;font:12px var(--px);cursor:pointer;text-shadow:1px 1px 0 var(--ink);letter-spacing:.04em}
.key kbd{font:11px var(--px);color:var(--ink);background:linear-gradient(#e8e0ff 40%,#c8bcff 40%);padding:2px 5px;border:2px solid;border-color:#fff #6a58d8 #6a58d8 #fff}
.key:active kbd,.key.down kbd{border-color:#6a58d8 #fff #fff #6a58d8}
button:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
@media (max-width:560px){
  header{justify-content:center}
  .tag{width:100%;text-align:center}
  #led{font-size:11px}
  #play{min-width:84px;font-size:18px}
  #keys{gap:4px 10px}
}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>

<div id="frame">
  <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
  <header>
    <img id="logo" alt="Sadie's Play Place">
    <div class="tag"><b>SHAREWARE V0.9 BETA</b><i>PLEASE COPY &amp; SHARE!</i></div>
  </header>
  <div id="view" class="sunk">
    <canvas id="c" aria-label="The clubhouse, in 3D"></canvas>
    <div id="stats"></div>
    <div id="hint">TAP THE FLOOR TO WALK &middot; DRAG TO LOOK</div>
    <div id="pad" aria-label="Walk and turn">
      <button data-d="f" aria-label="Walk forward"><i class="up"></i></button><button data-d="l" aria-label="Turn left"><i class="lt"></i></button>
      <button data-d="r" aria-label="Turn right"><i class="rt"></i></button><button data-d="b" aria-label="Walk back"><i class="dn"></i></button>
    </div>
  </div>
  <div id="dash">
    <div id="led" class="sunk" aria-live="polite"></div>
    <button id="play">PLAY!</button>
  </div>
  <nav id="keys">
    <button class="key" id="kHelp" data-k="F1"><kbd>F1</kbd>HELP</button>
    <button class="key" id="kSound" data-k="F3"><kbd>F3</kbd>SOUND</button>
    <button class="key" id="kAbout" data-k="F5"><kbd>F5</kbd>ABOUT</button>
    <button class="key" id="kMore" data-k="PageDown"><kbd>PGDN</kbd>MORE SHELVES</button>
    <button class="key" id="kQuit" data-k="Escape"><kbd>ESC</kbd>QUIT</button>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const A = /*ASSETS*/{};
const $ = s => document.querySelector(s);
document.documentElement.style.setProperty('--weave', `url(${A.weave})`);
document.documentElement.style.setProperty('--hand', `url(${A.hand}) 6 0`);

// ---------- the chrome: logo at a whole-number size, LED board that types ----------
const logo = $('#logo');
function fitLogo() {
  const narrow = innerWidth < 560;
  logo.src = narrow ? A.logo2 : A.logo;
  const w = narrow ? 82 : 150, h = narrow ? 38 : 20;
  const room = $('header').clientWidth - (narrow ? 0 : $('.tag').offsetWidth + 16);
  const k = Math.max(1, Math.min(narrow ? 3 : 4, Math.floor(room / w)));
  logo.width = w * k; logo.height = h * k;
}
let typing = 0;
function say(lines) {
  const led = $('#led'); clearInterval(typing);
  led.innerHTML = lines.map((l, i) => `<div class="${i ? '' : 't'}"></div>`).join('');
  const rows = [...led.children]; let r = 0, c = 0;
  typing = setInterval(() => {
    if (r >= lines.length) return clearInterval(typing);
    rows[r].textContent = lines[r].slice(0, ++c);
    if (c >= lines[r].length) { r++; c = 0; }
  }, 14);
}

// ---------- PS1-style drawing: snapped corners, wobbly textures, 15-bit colour with dither ----------
const res = new THREE.Vector2(320, 240);
const lamp = new THREE.Vector3(0, 2.2, 1.3);
const VS = `
uniform vec2 uRes; uniform vec2 uRep; uniform vec3 uLamp; uniform float uUnlit;
varying vec2 vUvW; varying float vW; varying float vLight;
void main(){
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vec4 p = projectionMatrix * viewMatrix * wp;
  vec2 g = uRes * 0.5;
  p.xy = floor(p.xy / p.w * g + 0.5) / g * p.w;           // corners snap to the pixel grid: the jitter
  gl_Position = p;
  vec3 n = normalize(mat3(modelMatrix) * normal);
  float sun = max(dot(n, normalize(vec3(-0.45, 0.8, 0.35))), 0.0);
  vec3 toL = uLamp - wp.xyz; float d = length(toL);
  float bulb = max(dot(n, toL / d), 0.0) * clamp(1.4 - d * 0.32, 0.0, 1.0);
  vLight = mix(0.42 + 0.3 * sun + 0.55 * bulb, 1.0, uUnlit);  // lit per corner, like 1996
  vUvW = uv * uRep * p.w; vW = p.w;                        // with the divide below: affine, so textures swim
}`;
const FS = `
uniform sampler2D map; uniform vec3 tint; uniform float uGlow; uniform float uLevels;
varying vec2 vUvW; varying float vW; varying float vLight;
float b2(vec2 a){ a = floor(a); return fract(a.x * 0.5 + a.y * a.y * 0.75); }
float bayer(vec2 a){ return b2(0.5 * a) * 0.25 + b2(a); }
void main(){
  vec4 c = texture2D(map, vUvW / vW);
  if (c.a < 0.5) discard;
  vec3 col = c.rgb * tint * vLight * 1.12 + uGlow * vec3(1.0, 0.8, 0.25);
  float d = bayer(gl_FragCoord.xy);
  col = floor(col * uLevels + d) / uLevels;              // few colours, ordered dither between them
  gl_FragColor = vec4(col, 1.0);
}`;
const loader = new THREE.TextureLoader();
const tex = {};
function T(name) {
  if (tex[name]) return tex[name];
  const t = loader.load(A[name]);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return tex[name] = t;
}
const white = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1, THREE.RGBAFormat); white.needsUpdate = true;
function psx(map, o = {}) {
  return new THREE.ShaderMaterial({
    uniforms: { map: { value: map || white }, uRes: { value: res }, uRep: { value: new THREE.Vector2(o.rx || 1, o.ry || 1) },
      tint: { value: new THREE.Color(o.tint ?? 0xffffff) }, uGlow: { value: 0 }, uLamp: { value: lamp }, uUnlit: { value: o.unlit || 0 },
      uLevels: { value: 14 } },
    vertexShader: VS, fragmentShader: FS, side: o.side ?? THREE.FrontSide,
    // things stuck flat on something else (posters, trim, tape, the rug) win the depth test outright, so they never flicker
    polygonOffset: !!o.decal, polygonOffsetFactor: -2, polygonOffsetUnits: -8 });
}

// ---------- the room (metres: y up; the back wall is +z) ----------
const RW = 1.6, RH = 2.4, ZB = 3.3, ZF = -1.4;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0628);
function plane(w, h, mat, pos, rotY = 0, rotX = 0, seg = 6) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h, seg, seg), mat);
  m.position.set(...pos); m.rotation.order = 'YXZ'; m.rotation.y = rotY; m.rotation.x = rotX;
  scene.add(m); return m;
}
const D = ZB - ZF;
const floorMesh = plane(RW * 2, D, psx(T('floor'), { rx: RW * 2 / 0.72, ry: D / 0.72 }), [0, 0, (ZB + ZF) / 2], 0, -Math.PI / 2, 10);
plane(RW * 2, D, psx(null, { tint: 0xfff3ea }), [0, RH, (ZB + ZF) / 2], 0, Math.PI / 2, 8);
const wallMat = (w) => psx(T('wall'), { rx: w / 0.6, ry: RH / 0.6 });
plane(RW * 2, RH, wallMat(RW * 2), [0, RH / 2, ZB], Math.PI);
plane(RW * 2, RH, wallMat(RW * 2), [0, RH / 2, ZF], 0);
plane(D, RH, wallMat(D), [-RW, RH / 2, (ZB + ZF) / 2], Math.PI / 2);
plane(D, RH, wallMat(D), [RW, RH / 2, (ZB + ZF) / 2], -Math.PI / 2);
// the zigzag border under the ceiling and the baseboards, round all four walls
for (const [w, pos, ry, inX, inZ] of [[RW * 2, [0, 0, ZB], Math.PI, 0, -1], [RW * 2, [0, 0, ZF], 0, 0, 1], [D, [-RW, 0, (ZB + ZF) / 2], Math.PI / 2, 1, 0], [D, [RW, 0, (ZB + ZF) / 2], -Math.PI / 2, -1, 0]]) {
  const e = 0.004;
  plane(w, 0.12, psx(T('zigzag'), { rx: w / 0.12, ry: 1, unlit: 0.3, decal: true }), [pos[0] + inX * e, RH - 0.08, pos[2] + inZ * e], ry, 0, 1);
  plane(w, 0.1, psx(null, { tint: 0xe8e0ff, decal: true }), [pos[0] + inX * e, 0.05, pos[2] + inZ * e], ry, 0, 1);
}
// window with curtains (left wall), poster (back wall), door (front wall), rug (floor)
plane(1.2, 0.98, psx(T('window'), { unlit: 0.55, decal: true }), [RW - 0.006, 1.35, 1.7], -Math.PI / 2, 0, 3);
plane(0.26, 1.15, psx(T('curtain'), { decal: true }), [RW - 0.02, 1.3, 1.7 - 0.72], -Math.PI / 2, 0, 2);
plane(0.26, 1.15, psx(T('curtain'), { decal: true }), [RW - 0.02, 1.3, 1.7 + 0.72], -Math.PI / 2, 0, 2);
plane(1.75, 0.04, psx(null, { tint: 0xffd23a, decal: true }), [RW - 0.025, 1.9, 1.7], -Math.PI / 2, 0, 1);
plane(0.55, 0.55, psx(T('poster'), { decal: true }), [1.08, 1.4, ZB - 0.006], Math.PI, 0, 2);
plane(0.85, 1.9, psx(T('door'), { decal: true }), [-0.55, 0.95, ZF + 0.006], 0, 0, 3);
const rug = plane(1.7, 1.2, psx(T('rug'), { decal: true }), [0.35, 0.004, 1.2], 0, -Math.PI / 2, 4);

// ceiling fan and its bulb, turning slowly
const fan = new THREE.Group(); fan.position.set(lamp.x, RH, lamp.z); scene.add(fan);
const fanWood = psx(T('wood'), { rx: 2, ry: 0.4 });
const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.22, 6), psx(null, { tint: 0xffd23a })); rod.position.y = -0.11; fan.add(rod);
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.07, 0.07, 8), psx(null, { tint: 0xffd23a })); hub.position.y = -0.24; fan.add(hub);
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), psx(null, { tint: 0xfff6b0, unlit: 1 })); bulb.position.y = -0.3; fan.add(bulb);
const blades = new THREE.Group(); blades.position.y = -0.24; fan.add(blades);
for (let i = 0; i < 4; i++) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.015, 0.13), fanWood);
  b.position.set(Math.cos(i * Math.PI / 2) * 0.38, 0, Math.sin(i * Math.PI / 2) * 0.38); b.rotation.y = -i * Math.PI / 2;
  blades.add(b);
}

// ---------- cubby shelves: one box per activity ----------
const CW = 0.58, CH = 0.46, TH = 0.05, DEP = 0.4, KICK = 0.07;
const pickable = [];
const woodMat = psx(T('wood'), { rx: 1.5, ry: 1.5 }), innerMat = psx(T('wood'), { tint: 0x8a6a70 });
function shelf(cols, rows, contents, place) {
  const g = new THREE.Group(); scene.add(g);
  const W = cols * CW + (cols + 1) * TH, Hs = KICK + rows * CH + (rows + 1) * TH;
  const block = (w, h, d, x, y, z, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d, 2, 2, 1), mat); m.position.set(x, y, z); g.add(m); return m; };
  // sides run full height; boards fit between them; dividers fit between boards; the back fits inside
  const IW = W - 2 * TH;
  for (const s of [-1, 1]) block(TH, Hs, DEP, s * (W - TH) / 2, Hs / 2, -DEP / 2, woodMat);
  block(IW, KICK + TH, DEP, 0, (KICK + TH) / 2, -DEP / 2, woodMat);
  block(IW, TH, DEP, 0, Hs - TH / 2, -DEP / 2, woodMat);
  for (let r = 1; r < rows; r++) block(IW, TH, DEP, 0, KICK + r * (CH + TH) + TH / 2, -DEP / 2, woodMat);
  for (let r = 0; r < rows; r++) {
    const y0 = KICK + TH + r * (CH + TH);
    for (let c = 1; c < cols; c++) block(TH, CH, DEP - 0.03, -W / 2 + c * (CW + TH) + TH / 2, y0 + CH / 2, -(DEP - 0.03) / 2, woodMat);
    block(IW, CH, 0.03, 0, y0 + CH / 2, -DEP + 0.015, innerMat);
  }
  contents.forEach((kind, i) => {
    const r = Math.floor(i / cols), c = i % cols;
    const cx = -W / 2 + TH + c * (CW + TH) + CW / 2, cy = KICK + TH + (rows - 1 - r) * (CH + TH);
    if (kind === 'dropper' || kind === 'locked') {
      const w = CW - 0.12, h = CH - 0.07, d = DEP - 0.16;
      const front = psx(T(kind)), side = psx(null, { tint: kind === 'dropper' ? 0xc8127a : 0x1e1458 }), top = psx(null, { tint: kind === 'dropper' ? 0xffffff : 0x2c2070 });
      const mats = [side, side, top, side, front, side];
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d, 2, 2, 1), mats);
      m.position.set(cx - 0.02, cy + h / 2, -d / 2 - 0.1); g.add(m);
      m.userData = { kind, home: m.position.z, out: 0, mats, slide: kind === 'dropper' ? 0.1 : 0 };
      pickable.push(m);
      if (kind === 'locked') {  // taped shut, with a padlock
        for (const s of [-1, 1]) {
          const t = new THREE.Mesh(new THREE.PlaneGeometry(CW * 1.05, 0.055, 4, 1), psx(T('tape'), { rx: 3.5, unlit: 0.2, decal: true }));
          t.position.set(cx, cy + CH / 2 + s * 0.02, 0.006 + (s + 1) * 0.002); t.rotation.z = s * 0.42; g.add(t);
        }
        const l = new THREE.Mesh(new THREE.PlaneGeometry(0.07, 0.08), psx(T('padlock'), { unlit: 0.3, decal: true }));
        l.position.set(cx, cy + 0.08, 0.012); g.add(l);
      }
    } else if (kind === 'card') {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(CW - 0.14, CH - 0.2, 2, 2), psx(T('card'), { unlit: 0.25, decal: true }));
      m.position.set(cx, cy + CH / 2, -DEP + 0.04); m.userData = { kind, mats: [m.material] }; g.add(m); pickable.push(m);
    }
  });
  place(g, W, Hs);
  const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(g.quaternion);
  for (const m of g.children) if (m.userData.kind) m.userData.normal = normal;
  return { g, W, Hs, normal };
}
const s1 = shelf(3, 2, ['dropper', 'locked', 'locked', 'card', null, null], (g) => { g.position.set(-0.2, 0, ZB - DEP); g.rotation.y = Math.PI; });
shelf(3, 2, ['locked', 'locked', 'locked', null, null, null], (g) => { g.position.set(-RW + DEP, 0, 1.2); g.rotation.y = Math.PI / 2; });

// ---------- Sadie: a flat sprite in the 3D room, always turned to face you ----------
const sadieMat = psx(T('sadie'), { unlit: 0.35 });
const sadie = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.5, 1, 1).translate(0, 0.25, 0), sadieMat);
sadie.position.set(-0.2 - s1.W / 2 + 0.42, s1.Hs, ZB - DEP / 2);
sadie.userData = { kind: 'sadie', mats: [sadieMat], normal: s1.normal }; scene.add(sadie); pickable.push(sadie);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.18), psx(T('blob'), { unlit: 1, decal: true }));
shadow.rotation.x = -Math.PI / 2; shadow.position.set(sadie.position.x, s1.Hs + 0.003, sadie.position.z); scene.add(shadow);

// ---------- camera: you look around; the idle drift never fights you ----------
const EYE = 1.35;
const cam = new THREE.PerspectiveCamera(60, 1, 0.1, 20);
cam.position.set(0.15, EYE, -0.2); cam.rotation.order = 'YXZ';
const look = { yaw: Math.PI, pitch: -0.2, toYaw: null, toPitch: null, drag: null, touched: false };
const walk = { to: null, held: { f: 0, b: 0, l: 0, r: 0 }, bob: 0, moved: false };
// where you're allowed to stand: inside the walls, not inside a shelf
function spot(x, z) {
  x = Math.max(-RW + 0.3, Math.min(RW - 0.3, x));
  z = Math.max(ZF + 0.3, Math.min(ZB - DEP - 0.9, z));   // keep a step back from the shelves, so you can see them
  if (z > -0.5 && z < 2.9) x = Math.max(x, -RW + DEP + 0.9);
  return [x, z];
}
const shortWay = (from, to) => from + ((to - from) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI;
// which way to face to look at a spot on the floor plan (the camera looks down -z at yaw 0)
const aim = (x, z) => Math.atan2(-(x - cam.position.x), -(z - cam.position.z));
const SHELF1 = () => aim(-0.2, ZB), SHELF2 = () => aim(-RW, 1.2);
const renderer = new THREE.WebGLRenderer({ canvas: $('#c'), antialias: false });
renderer.setPixelRatio(1);

function resize() {
  const v = $('#view'), w = v.clientWidth, h = v.clientHeight;
  const k = Math.max(1, Math.floor(Math.min(w, h) / 200)); // big chunky pixels, but never under 200 across
  const iw = Math.ceil(w / k), ih = Math.ceil(h / k);
  renderer.setSize(iw, ih, false); res.set(iw, ih);
  cam.aspect = iw / ih;
  const hfov = 78 * Math.PI / 180;
  cam.fov = Math.min(88, Math.max(52, 2 * Math.atan(Math.tan(hfov / 2) / cam.aspect) * 180 / Math.PI));
  const tall = cam.aspect < 0.8;                        // on a tall phone screen, start nearer the shelf
  if (!walk.moved) cam.position.set(tall ? -0.2 : 0.15, EYE, tall ? 1.55 : -0.2);
  cam.updateProjectionMatrix();
  if (!look.touched && look.toYaw === null) look.yaw = SHELF1();
  fitLogo();
}
new ResizeObserver(resize).observe($('#view'));

// ---------- picking boxes, and what the LED board says about them ----------
const TEXT = {
  dropper: ["SADIE'S DROPPER WORLD", 'A MOLE DROPS JELLY ON EVERYTHING.', 'SADIE CLIMBS THE PILE FOR HAY.'],
  locked: ['UNDER CONSTRUCTION', "THIS ONE ISN'T BUILT YET.", 'CHECK BACK IN 1996!'],
  card: ['** CHAPTER 2 **', 'COMING SOON 1996!', 'MORE FRIENDS! MORE ACTIVITIES!'],
  sadie: ['SADIE', 'MOOD: UNIMPRESSED.', 'SHE WAS HERE FIRST.'],
};
let chosen = null, chosenAt = 0;
function choose(m) {
  chosen = m; chosenAt = performance.now() / 1000;
  if (m) say(TEXT[m.userData.kind]);
  $('#play').disabled = !m || m.userData.kind !== 'dropper';
}
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev) {
  const r = $('#c').getBoundingClientRect();
  ndc.set((ev.clientX - r.left) / r.width * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, cam);
  const hit = ray.intersectObjects([...pickable, floorMesh, rug], false)[0];
  if (!hit) return;
  if (hit.object === floorMesh || hit.object === rug) walkTo(hit.point.x, hit.point.z);
  else { choose(hit.object); goSee(hit.object); }
}
function walkTo(x, z) { walk.to = spot(x, z); walk.moved = true; hideHint(); }
// walk up to something and look at it (nearer on a phone)
function goSee(m) {
  const p = m.getWorldPosition(new THREE.Vector3()), n = m.userData.normal;
  if (m.userData.kind === 'sadie') p.y += 0.2;
  const d = cam.aspect < 0.8 ? 1.05 : 1.45;
  const [x, z] = spot(p.x + n.x * d, p.z + n.z * d);
  walk.to = [x, z]; walk.moved = true;
  look.toYaw = shortWay(look.yaw, Math.atan2(-(p.x - x), -(p.z - z)));
  look.toPitch = Math.max(-0.7, Math.min(0.5, Math.atan2(p.y - EYE, Math.hypot(p.x - x, p.z - z))));
  hideHint();
}
function hideHint() { if (!look.touched) { look.touched = true; $('#hint').style.opacity = 0; } }
const view = $('#view');
view.addEventListener('pointerdown', e => { view.setPointerCapture(e.pointerId); look.drag = { x: e.clientX, y: e.clientY, moved: 0 }; });
view.addEventListener('pointermove', e => {
  if (!look.drag) return;
  const dx = e.clientX - look.drag.x, dy = e.clientY - look.drag.y;
  look.drag.x = e.clientX; look.drag.y = e.clientY; look.drag.moved += Math.abs(dx) + Math.abs(dy);
  const k = 3.2 / Math.max(view.clientWidth, 400);
  look.yaw += dx * k; look.pitch = Math.max(-0.75, Math.min(0.55, look.pitch + dy * k));
  look.toYaw = look.toPitch = null;
  if (look.drag.moved > 6) hideHint();
});
view.addEventListener('pointerup', e => { if (look.drag && look.drag.moved < 8) pick(e); look.drag = null; });
view.addEventListener('pointercancel', () => { look.drag = null; });

// ---------- the F-keys and PLAY! ----------
let sound = false;
const actions = {
  F1: () => say(['HELP', 'TAP FLOOR: WALK. DRAG: LOOK.', 'TAP A BOX OR SADIE: GO SEE.', 'ARROWS: WALK. PGDN: NEXT SHELF.']),
  F3: () => { sound = !sound; say(['SOUND', sound ? 'SOUND: ON (THERE IS NO SOUND YET)' : 'SOUND: OFF', 'SOUNDBLASTER 16 NOT DETECTED.']); },
  F5: () => say(["SADIE'S PLAY PLACE V0.9 BETA", 'A 3D TEST ROOM. (C) 1995-ISH.', 'THIS IS NOT THE GAME. JUST A LOOK.']),
  PageDown: () => {
    const off = y => Math.abs(((look.yaw - y) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI);
    const near1 = off(SHELF1()) < off(SHELF2());
    const to = near1 ? SHELF2() : SHELF1();
    look.toYaw = shortWay(look.yaw, to); look.toPitch = -0.2;
    say(near1 ? ['SHELF 2 OF 2', 'ALL UNDER CONSTRUCTION.', 'NEW ACTIVITIES GO HERE.'] : ['SHELF 1 OF 2', "SADIE'S FAVORITES.", 'TAP A BOX TO PICK IT.']);
  },
  Escape: () => say(['QUIT?', "THERE'S NOWHERE TO GO.", 'SADIE WOULD LIKE YOU TO STAY.']),
  Enter: () => play(),
};
for (const b of document.querySelectorAll('.key')) b.addEventListener('click', () => actions[b.dataset.k]());
for (const b of document.querySelectorAll('#pad button')) {
  const d = b.dataset.d, set = v => { walk.held[d] = v; b.classList.toggle('down', !!v); };
  b.addEventListener('pointerdown', e => { e.stopPropagation(); b.setPointerCapture(e.pointerId); set(1); walk.to = null; walk.moved = true; hideHint(); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, () => set(0));
}
const MOVE = { ArrowUp: 'f', w: 'f', W: 'f', ArrowDown: 'b', s: 'b', S: 'b', ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r' };
addEventListener('keydown', e => { const d = MOVE[e.key]; if (d) { e.preventDefault(); walk.held[d] = 1; walk.to = null; walk.moved = true; hideHint(); } });
addEventListener('keyup', e => { const d = MOVE[e.key]; if (d) walk.held[d] = 0; });
addEventListener('blur', () => { for (const k in walk.held) walk.held[k] = 0; });
addEventListener('keydown', e => {
  const a = actions[e.key]; if (!a) return;
  e.preventDefault(); a();
  const b = document.querySelector(`.key[data-k="${e.key}"]`);
  if (b) { b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 120); }
});
function play() {
  if (!chosen || chosen.userData.kind !== 'dropper') return;
  const bar = n => 'LOADING [' + '#'.repeat(n) + '.'.repeat(12 - n) + ']';
  let n = 0; say(["SADIE'S DROPPER WORLD", bar(0)]);
  const t = setInterval(() => {
    n++;
    if (n <= 12) { $('#led').children[1] && ($('#led').children[1].textContent = bar(n)); return; }
    clearInterval(t);
    say(["SADIE'S DROPPER WORLD", 'THIS IS ONLY THE TEST ROOM,', 'SO THERE IS NOTHING TO LOAD YET!']);
  }, 110);
}
$('#play').addEventListener('click', play);

// ---------- the loop ----------
let last = performance.now(), fpsT = 0, frames = 0, blinkAt = 2.5, blinkOff = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (look.toYaw !== null) {
    look.yaw += (look.toYaw - look.yaw) * Math.min(1, dt * 3);
    if (Math.abs(look.toYaw - look.yaw) < 0.002) look.toYaw = null;
  }
  if (look.toPitch !== null) {
    look.pitch += (look.toPitch - look.pitch) * Math.min(1, dt * 3);
    if (Math.abs(look.toPitch - look.pitch) < 0.002) look.toPitch = null;
  }
  const h = walk.held, turn = h.l - h.r, go = h.f - h.b;
  if (turn) { look.yaw += turn * 1.7 * dt; look.toYaw = null; }
  let moving = false;
  if (go) {
    const [x, z] = spot(cam.position.x - Math.sin(look.yaw) * go * 1.4 * dt, cam.position.z - Math.cos(look.yaw) * go * 1.4 * dt);
    moving = Math.hypot(x - cam.position.x, z - cam.position.z) > 1e-4;
    cam.position.x = x; cam.position.z = z;
  } else if (walk.to) {
    const dx = walk.to[0] - cam.position.x, dz = walk.to[1] - cam.position.z, dist = Math.hypot(dx, dz), step = 1.5 * dt;
    if (dist <= step) { cam.position.x = walk.to[0]; cam.position.z = walk.to[1]; walk.to = null; }
    else { cam.position.x += dx / dist * step; cam.position.z += dz / dist * step; moving = true; }
  }
  walk.bob = moving ? walk.bob + dt * 9 : walk.bob * 0.85;   // a little 90s head bob while walking
  cam.position.y = EYE + Math.sin(walk.bob) * 0.022;
  const drift = look.touched ? 0 : Math.sin(t * 0.35) * 0.05;       // gentle, and gone once you've looked around
  cam.rotation.y = look.yaw + drift; cam.rotation.x = look.pitch;
  blades.rotation.y += dt * 1.6;
  sadie.rotation.y = Math.atan2(cam.position.x - sadie.position.x, cam.position.z - sadie.position.z);
  if (t > blinkAt) { sadieMat.uniforms.map.value = T('sadieBlink'); blinkOff = t + 0.14; blinkAt = t + 2.5 + Math.random() * 3; }
  if (blinkOff && t > blinkOff) { sadieMat.uniforms.map.value = T('sadie'); blinkOff = 0; }
  for (const m of pickable) {  // the chosen one slides out and glows
    const on = m === chosen, u = m.userData;
    if (u.home !== undefined) {
      u.out += ((on ? u.slide : 0) - u.out) * Math.min(1, dt * 8); m.position.z = u.home + u.out;
      m.rotation.z = on && !u.slide ? Math.sin(t * 30) * 0.02 * Math.max(0, 1 - (t - chosenAt) * 2) : 0;  // taped shut: it just rattles
    }
    const glow = on ? 0.1 + 0.08 * Math.sin(t * 6) : 0;
    for (const mat of u.mats) mat.uniforms.uGlow.value = glow;
  }
  renderer.render(scene, cam);
  frames++; fpsT += dt;
  if (fpsT > 0.5) { $('#stats').textContent = `${res.x}X${res.y} ${Math.round(frames / fpsT)}FPS`; frames = 0; fpsT = 0; }
  requestAnimationFrame(frame);
}
resize();
choose(pickable.find(m => m.userData.kind === 'dropper'));
requestAnimationFrame(frame);
</script>
